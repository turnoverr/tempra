<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'/><meta name='viewport' content='width=device-width, initial-scale=1.0'/>
<title>Tempra</title>
<script crossorigin src='https://unpkg.com/react@18/umd/react.production.min.js'></script>
<script crossorigin src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js'></script>
<script src='https://unpkg.com/@babel/standalone/babel.min.js'></script>
<style>
body{margin:0;background:#f7f7f5;color:#111;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif}*{box-sizing:border-box}.app{min-height:100vh;padding:20px;background:#f7f7f5}.shell{max-width:430px;margin:auto}.phone{background:white;border-radius:42px;padding:24px;min-height:90vh;box-shadow:0 20px 80px rgba(0,0,0,.08)}.date{font-size:13px;opacity:.45;letter-spacing:.12em}.time{font-size:34px;font-weight:500;margin:18px 0}.icons{display:flex;justify-content:space-between;align-items:center;margin:30px 0;font-size:44px;color:#999}.metrics{display:flex;justify-content:space-between;font-size:13px;opacity:.55;margin:28px 0}.graph{height:140px;border-bottom:1px solid #eee;position:relative}.line{position:absolute;left:0;right:0;bottom:20px;height:2px;background:linear-gradient(90deg,#ddd,#999,#ddd);border-radius:2px}.tempRead{position:absolute;right:20px;top:25px;font-size:42px}.insight{margin:24px 0;padding:18px;border-radius:24px;background:#fafafa;font-size:15px;line-height:1.6}.dialWrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:min(380px,90vw)}.dialTrack{height:54px;background:#f0f0ee;border-radius:999px;position:relative}.dial{position:absolute;top:7px;width:40px;height:40px;border-radius:50%;background:#111;transition:left .35s}.labelL,.labelR{position:absolute;top:18px;font-size:12px;letter-spacing:.12em}.labelL{left:20px}.labelR{right:20px}.card{padding:18px;border-bottom:1px solid #eee}.row{display:flex;justify-content:space-between;padding:14px 0}.title{font-size:16px;font-weight:600}
</style></head><body><div id='root'></div>
<script type='text/babel'>
const {useState,useEffect}=React;
const I={0:'○',1:'○',2:'◔',3:'◌',61:'◒',63:'◒',95:'◎'};
function insight(d){if(d.precipitation_probability_max>60)return 'Rain building later. Best outdoor window is before mid-afternoon.';if(d.temperature_2m_max>26)return 'Warm and stable. Clear movement conditions through most of the day.';return 'Balanced atmospheric conditions. Comfortable visibility and low disruption risk.'}
function App(){const [data,setData]=useState(null);const [mode,setMode]=useState(0);useEffect(()=>{fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.8136&longitude=144.9631&current=temperature_2m,weathercode&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,uv_index_max&timezone=Australia/Melbourne').then(r=>r.json()).then(setData)},[]);if(!data)return <div className='app'><div className='shell'><div className='phone'>Loading Tempra…</div></div></div>;const d={max:data.daily.temperature_2m_max[0],min:data.daily.temperature_2m_min[0],rain:data.daily.precipitation_probability_max[0],wind:data.daily.wind_speed_10m_max[0],uv:data.daily.uv_index_max[0]};const detailed=mode===1;return <div className='app'><div className='shell'><div className='phone'>{!detailed?<><div className='date'>06/11, WED</div><div className='time'>10:00 AM</div><div className='icons'><span>{I[data.current.weathercode]||'○'}</span><span>○</span><span>◌</span></div><div className='metrics'><span>{d.rain}% rain</span><span>UV {Math.round(d.uv)}</span><span>{Math.round(d.wind)} km/h</span></div><div className='graph'><div className='tempRead'>{Math.round(data.current.temperature_2m)}°</div><div className='line'></div></div><div className='insight'><strong>Tempra Insight</strong><br/>{insight({precipitation_probability_max:d.rain,temperature_2m_max:d.max})}</div></>:<><div className='title'>Tempra Insight</div><div className='card'><div className='row'><span>True Feel</span><span>{Math.round(data.current.temperature_2m+2)}°</span></div><div className='row'><span>Rain Radar</span><span>{d.rain}%</span></div><div className='row'><span>Air Quality</span><span>Good</span></div><div className='row'><span>Smart Alerts</span><span>2 Active</span></div><div className='row'><span>Your Places</span><span>4 Saved</span></div><div className='row'><span>UV</span><span>{Math.round(d.uv)}</span></div></div><div className='insight'>{insight({precipitation_probability_max:d.rain,temperature_2m_max:d.max})}</div></>}</div></div><div className='dialWrap'><div className='dialTrack' onClick={()=>setMode(mode?0:1)}><span className='labelL'>SIMPLE</span><span className='labelR'>DETAILED</span><div className='dial' style={{left:mode?'calc(100% - 47px)':'7px'}}></div></div></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
